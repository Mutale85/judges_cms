# Judicial Chambers — reference nginx configuration (TLS termination).
#
#   chambers.example.court.zm    -> PHP-FPM (the application)
#   transcribe.example.court.zm  -> Node transcription service (WSS)
#
# Data in transit: only TLS 1.2/1.3 with forward-secret AEAD ciphers; plain
# HTTP is redirected; HSTS is sent. Traffic from nginx to the Node service is
# re-encrypted (proxy_pass https://) so audio is never plaintext on the wire,
# even inside the data centre.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:JC_SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chambers.example.court.zm;

    ssl_certificate     /etc/judicial-chambers/tls/chambers.fullchain.pem;
    ssl_certificate_key /etc/judicial-chambers/tls/chambers.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /opt/judicial-chambers/app/public;
    index index.php;
    client_max_body_size 110m;   # MAX_UPLOAD_MB + overhead

    # Never serve anything except public/ (storage, .env and source live outside the web root).
    location ~ /\. { deny all; }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm-judicial.sock;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;   # stream audio/document downloads as they are decrypted
    }

    # The /internal/ callbacks are for the transcription service only.
    location /internal/ {
        allow 10.0.0.0/8;        # adjust to the transcription host(s)
        deny all;
        try_files $uri /index.php$is_args$args;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 off;                   # WebSocket upgrade requires HTTP/1.1
    server_name transcribe.example.court.zm;

    ssl_certificate     /etc/judicial-chambers/tls/transcribe.fullchain.pem;
    ssl_certificate_key /etc/judicial-chambers/tls/transcribe.key;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location = /capture {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/judicial-chambers/tls/internal-ca.pem;
        proxy_ssl_name transcription.internal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;   # hearings are long
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
